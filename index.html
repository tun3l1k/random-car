<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Random Car</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="css/style.css?v=5">
</head>

<body>

<div class="app">

    <!-- =========================================
         ВЕРХНЯЯ ПАНЕЛЬ
         ========================================= -->

    <header class="topbar">

        <div class="topbar-left">

            <div class="season-info">

    <div class="season-badge">
        <span>СЕЗОН</span>
        <strong id="seasonNumber">1</strong>
    </div>

    <div class="season-name" id="seasonName">
        JDM
    </div>

</div>


        <div class="topbar-right">

            <div class="balance">
                🪙
                <span id="balance">10000</span>
            </div>


            <button
                id="menuButton"
                class="burger-button"
                type="button"
                aria-label="Открыть меню"
            >
                ☰
            </button>

        </div>

    </header>


    <!-- =========================================
         ГЛАВНЫЙ ЭКРАН
         ========================================= -->

    <main class="main">

        <section class="welcome">

            <div class="welcome-small">
                RANDOM CAR
            </div>

            <h1>
                Собери их всех
            </h1>

            <p>
                Открывай кейсы и получай редкие автомобили.
            </p>

        </section>


        <!-- =====================================
             ТЕКУЩИЙ КЕЙС
             ===================================== -->

        <section class="case-card">

            <div class="case-image">
                🚘
            </div>


            <div class="case-info">

                <h2>
                    Random Case
                </h2>

                <p>
                    Случайный автомобиль
                </p>

            </div>


            <button
                id="openCaseButton"
                class="main-button"
                type="button"
            >
                🎁 ОТКРЫТЬ КЕЙС
            </button>


            <div class="case-price">

                Стоимость:

                <b>
                    500 🪙
                </b>

            </div>

        </section>


        <!-- =====================================
             КНОПКА ВСЕХ КЕЙСОВ
             ===================================== -->

        <button
            id="casesButton"
            class="secondary-button"
            type="button"
        >
            🎁 КЕЙСЫ
        </button>

    </main>


    <!-- =========================================
         ЗАТЕМНЕНИЕ МЕНЮ
         ========================================= -->

    <div
        id="menuOverlay"
        class="menu-overlay"
    ></div>


    <!-- =========================================
         БОКОВОЕ МЕНЮ
         ========================================= -->

    <aside
        id="sideMenu"
        class="side-menu"
        aria-hidden="true"
    >

        <div class="side-menu-header">

            <strong>
                RANDOM CAR
            </strong>


            <button
                id="closeMenuButton"
                class="close-menu"
                type="button"
                aria-label="Закрыть меню"
            >
                ✕
            </button>

        </div>


        <div class="side-menu-list">

            <!-- КОЛЛЕКЦИЯ -->

            <button
                class="side-menu-item"
                type="button"
            >

                <span>
                    🚗
                </span>

                <strong>
                    Коллекция
                </strong>

            </button>


            <!-- РЕЙТИНГ -->

            <button
                class="side-menu-item"
                type="button"
            >

                <span>
                    🏆
                </span>

                <strong>
                    Рейтинг
                </strong>

            </button>


            <!-- ЗАДАНИЯ -->

            <button
                class="side-menu-item"
                type="button"
            >

                <span>
                    🎯
                </span>

                <strong>
                    Задания
                </strong>

            </button>


            <!-- ПРОФИЛЬ -->

            <button
                class="side-menu-item"
                type="button"
            >

                <span>
                    👤
                </span>

                <strong>
                    Профиль
                </strong>

            </button>


            <!-- КЕЙСЫ -->

            <button
                class="side-menu-item"
                type="button"
            >

                <span>
                    🎁
                </span>

                <strong>
                    Кейсы
                </strong>

            </button>


            <!-- АПГРЕЙД -->

            <button
                class="side-menu-item"
                type="button"
            >

                <span>
                    ⬆️
                </span>

                <strong>
                    Апгрейд
                </strong>

            </button>


            <!-- НАСТРОЙКИ -->

            <button
                class="side-menu-item"
                type="button"
            >

                <span>
                    ⚙️
                </span>

                <strong>
                    Настройки
                </strong>

            </button>

        </div>

    </aside>

</div>


<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script src="js/season.js?v=1"></script>
<script src="js/cars.js?v=5"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
