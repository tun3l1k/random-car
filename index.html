<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Random Car</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <header class="topbar">
        <div>
            <div class="game-title">RANDOM CAR</div>
            <div class="player-name">Игрок</div>
        </div>
        <div class="balance">
            🪙 <span id="balance">10000</span>
        </div>
    </header>
    <main class="main">
        <section class="welcome">
            <div class="welcome-small">ТВОЯ КОЛЛЕКЦИЯ</div>
            <h1>Собери их всех</h1>
            <p>Открывай кейсы и получай редкие автомобили.</p>
        </section>
        <section class="case-card">
            <div class="case-image">
                🚘
            </div>
            <div class="case-info">
                <h2>Random Case</h2>
                <p>Случайный автомобиль</p>
            </div>
            <button id="openCaseButton" class="main-button">
                🎁 ОТКРЫТЬ КЕЙС
            </button>
            <div class="case-price">
                Стоимость: <b>500 🪙</b>
            </div>
        </section>
        <section class="menu">
            <button class="menu-button">
                <span>🚗</span>
                <strong>Коллекция</strong>
                <small>Твои автомобили</small>
            </button>
            <button class="menu-button">
                <span>🏆</span>
                <strong>Рейтинг</strong>
                <small>Лучшие игроки</small>
            </button>
            <button class="menu-button">
                <span>🎯</span>
                <strong>Задания</strong>
                <small>Получи награды</small>
            </button>
            <button class="menu-button">
                <span>👤</span>
                <strong>Профиль</strong>
                <small>Твоя статистика</small>
            </button>
        </section>
    </main>
    <nav class="bottom-nav">
        <button class="nav-button active">
            🏠
            <span>Главная</span>
        </button>
        <button class="nav-button">
            🚗
            <span>Коллекция</span>
        </button>
        <button class="nav-button">
            🏆
            <span>Рейтинг</span>
        </button>
        <button class="nav-button">
            👤
            <span>Профиль</span>
        </button>
    </nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
